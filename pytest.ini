[pytest]

python_files = test_*.py *_test.py
python_classes = Test*

markers =
    ui: UI tests
    courses: all tests related to courses
    regression: regression tests

# запуск тестов
# -s логи, принты в консоль
# -v больше инфы
# -k 'название теста' запустить один тест\класс
# --headed c открытием браузера
# -m 'название маркировки' например -m 'smoke'
# @pytest.mark.flaky(reruns=3, reruns_delay=2) перезапуск упавших тестов