[pytest]

python_files = test_*.py *_test.py
python_classes = Test*

addopts = -s -v
markers =
    ui: UI tests
    courses: all tests related to courses
    regression: regression tests

# запуск тестов
# -s логи, принты в консоль
# -v больше инфы
# -k 'название теста' запустить один тест\класс
# --headed c открытием браузера
# -m 'название маркировки' например -m 'smoke'
# @pytest.mark.flaky(reruns=3, reruns_delay=2) перезапуск упавших тестов
# python -m pytest --alluredir=./allure-results для генерации отчета
#    1. allure generate ./allure-results --output=./allure-report вывод статического отчета
#    2. allure serve ./allure-results - динамический отчет(вызов сервера)
# playwright show-trace ./tracing/test_create_course.zip -запуск Trace Viewer